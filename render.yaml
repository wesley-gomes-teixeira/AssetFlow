services:
  - type: web
    name: assetflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: standard
    healthCheckPath: /health
    healthCheckStartupTimeout: 300
    numInstances: 1

    # Expor apenas a porta que o frontend precisa
    ports:
      - number: 10000
        protocol: HTTP

    # Variáveis de ambiente com defaults seguros
    envVars:
      # Database
      - key: DATABASE_URL
        fromDatabase:
          name: assetflow-db
          property: connectionString

      # Security
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

      # Services configuration
      - key: DISABLE_RABBITMQ
        value: "true"
      - key: PORT
        value: "10000"

      # Internal routing (localhost para monolith)
      - key: INTERNAL_GATEWAY_URL
        value: http://127.0.0.1:3000
      - key: GATEWAY_BASE_URL
        value: /api/v1
      - key: AUTH_BASE_URL
        value: /auth

      # Service URLs (localhost em monolith container)
      - key: USERS_SERVICE_URL
        value: http://127.0.0.1:3001
      - key: ASSETS_SERVICE_URL
        value: http://127.0.0.1:3002
      - key: TICKETS_SERVICE_URL
        value: http://127.0.0.1:3003

      # Logging
      - key: LOG_LEVEL
        value: info

    # Build configuration
    buildCommand: |
      npm install && \
      cd users-service && npm install && npm run build && cd .. && \
      cd assets-service && npm install && npm run build && cd .. && \
      cd tickets-service && npm install && npm run build && cd .. && \
      cd gateway-service && npm install && npm run build && cd .. && \
      cd frontend-service && npm install && npm run build

    # Restart policy
    restartPolicy: on_failure

    # Max request/response size
    maxRequestSizeBytes: 10485760

    # Timeout
    startTimeoutSeconds: 300

# Database
databases:
  - name: assetflow-db
    databaseName: assetflow
    plan: standard
    postgresMajorVersion: "16"
